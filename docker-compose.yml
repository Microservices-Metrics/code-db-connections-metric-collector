services:
  api:
    build:
      context: ./src/CodeDbConnectionsMetricCollector.Api
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - LOG_FILE_PATH=/app/logs/requests-.log
    volumes:
      - ./logs:/app/logs
